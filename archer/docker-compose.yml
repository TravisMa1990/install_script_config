services:
  archer:
    restart: always
    privileged: true
    image: java:8
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    ports:
      - 2828:2828
    volumes:
      - ./Archer.jar:/www.jar
    environment:
      - TZ=Asia/Shanghai
    command: [
           'java',
           '-jar',
           '/www.jar',
           "--spring.profiles.active=216"
    ]
    
  archerui:
    restart: always
    privileged: true
    image: nginx:latest
    ports:
      - 2888:2888
    volumes:
      - ./dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
#      - ./config/nginx/conf.d:/etc/nginx/conf.d