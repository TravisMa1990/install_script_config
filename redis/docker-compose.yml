services:
  redis-node1:
    image: redis:latest
    container_name: redis-node1
    command: redis-server --port 7380 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --bind 0.0.0.0 --protected-mode no
    volumes:
      - ./redis/node1/data:/data
    network_mode: host
    restart: always

  redis-node2:
    image: redis:latest
    container_name: redis-node2
    command: redis-server --port 7381 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --bind 0.0.0.0 --protected-mode no
    volumes:
      - ./redis/node2/data:/data
    network_mode: host
    restart: always

  redis-node3:
    image: redis:latest
    container_name: redis-node3
    command: redis-server --port 7382 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --bind 0.0.0.0 --protected-mode no
    volumes:
      - ./redis/node3/data:/data
    network_mode: host
    restart: always

  redis-node4:
    image: redis:latest
    container_name: redis-node4
    command: redis-server --port 7383 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --bind 0.0.0.0 --protected-mode no
    network_mode: host
    volumes:
      - ./redis/node4/data:/data
    restart: always

  redis-node5:
    image: redis:latest
    container_name: redis-node5
    command: redis-server --port 7384 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --bind 0.0.0.0 --protected-mode no
    volumes:
      - ./redis/node5/data:/data
    network_mode: host
    restart: always

  redis-node6:
    image: redis:latest
    container_name: redis-node6
    command: redis-server --port 7385 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --bind 0.0.0.0 --protected-mode no
    volumes:
      - ./redis/node6/data:/data
    network_mode: host
    restart: always

  redis-cluster-init:
    image: redis:latest
    container_name: redis-cluster-init
    depends_on:
      - redis-node1
      - redis-node2
      - redis-node3
      - redis-node4
      - redis-node5
      - redis-node6
    network_mode: host
    command: >
      sh -c "sleep 10 && echo 'yes' | redis-cli --cluster create yourIP:7380 yourIP:7381 yourIP:7382 yourIP:7383 yourIP:7384 yourIP:7385 --cluster-replicas 1"
    restart: "no"