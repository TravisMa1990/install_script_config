# 网络
bind 0.0.0.0
port 6379
protected-mode no

# 数据/日志
dir /data
logfile "/var/log/redis/redis.log"
loglevel notice

# 持久化
save 900 1
save 300 10
save 60 10000

# 内存
maxmemory 256mb
maxmemory-policy allkeys-lru

# 访问密码
requirepass yourPassword

# 开启 AOF 持久化
appendonly yes


rename-command KEYS     ""
rename-command PEXPIRE  ""
rename-command DEL      ""
rename-command SHUTDOWN ""
rename-command BGREWRITEAOF ""
rename-command BGSAVE   ""
rename-command SAVE     ""
rename-command SPOP     ""
rename-command SREM     ""
rename-command RENAME   ""